name: Build and verify APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: release-keystore.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK parts
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configure protected release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "app/$ANDROID_KEYSTORE_PATH"
          chmod 600 "app/$ANDROID_KEYSTORE_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run host native core tests
        run: |
          cmake -S app/src/main/cpp -B build/native-tests -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests --parallel
          ctest --test-dir build/native-tests --output-on-failure

      - name: Run JVM tests and lint
        run: gradle testDebugUnitTest lintDebug --no-daemon

      - name: Build release native libraries
        run: gradle externalNativeBuildRelease --no-daemon

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signing state
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          if [ -f "app/$ANDROID_KEYSTORE_PATH" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
            echo "Release APK signed with configured protected keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No release keystore configured. Release artifact is unsigned and not production-ready."
            echo "Release APK is unsigned; configure repository secrets before distribution." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "Refusing tagged release build without protected signing material."
              exit 1
            fi
          fi

      - name: Record APK checksum and source commit
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LotteryMiner-release-build
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Assemble installable debug test APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LotteryMiner-debug-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LotteryMiner-release-build
          path: release-artifact

      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find release-artifact -type f -name '*.apk' -print -quit)
          test -n "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Lottery Miner $GITHUB_REF_NAME" \
            --notes "Signed APK built after native tests, JVM tests, lint, and Android native compilation. Source commit: $GITHUB_SHA"