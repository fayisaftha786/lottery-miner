name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just accept licenses and add NDK/CMake.
      - name: Install SDK parts
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LotteryMiner-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk LotteryMiner.apk
          gh release create "v1.${{ github.run_number }}" LotteryMiner.apk \
            --title "Lottery Miner build ${{ github.run_number }}" \
            --notes "Installable APK (signed with debug key)."
