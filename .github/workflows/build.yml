name: Build and verify APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: release-keystore.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK parts
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configure protected release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "app/$ANDROID_KEYSTORE_PATH"
          chmod 600 "app/$ANDROID_KEYSTORE_PATH"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: 8.11.1

      - name: Run host native core tests
        run: |
          cmake -S app/src/main/cpp -B build/native-tests -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests --parallel
          ctest --test-dir build/native-tests --output-on-failure

      - name: Run JVM tests and lint
        run: gradle testDebugUnitTest lintDebug --no-daemon

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LotteryMiner-jvm-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build release native libraries
        run: gradle externalNativeBuildRelease --no-daemon

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify 16 KB native ELF and APK alignment
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          READELF="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$READELF"
          test -x "$ZIPALIGN"
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          for ABI in arm64-v8a x86_64; do
            LIB="$TMP_DIR/libminercore-$ABI.so"
            unzip -p "$APK" "lib/$ABI/libminercore.so" > "$LIB"
            test -s "$LIB"
            ALIGNMENTS=$("$READELF" -lW "$LIB" | awk '$1 == "LOAD" { print $NF }')
            test -n "$ALIGNMENTS"
            while IFS= read -r ALIGN; do
              if (( ALIGN < 0x4000 )); then
                echo "16 KB ELF alignment failure: $ABI LOAD segment is $ALIGN"
                exit 1
              fi
            done <<< "$ALIGNMENTS"
          done
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Verify APK signing state
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          if [ -f "app/$ANDROID_KEYSTORE_PATH" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
            echo "Release APK signed with configured protected keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No release keystore configured. Release artifact is unsigned and not production-ready."
            echo "Release APK is unsigned; configure repository secrets before distribution." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "Refusing tagged release build without protected signing material."
              exit 1
            fi
          fi

      - name: Record APK checksum and source commit
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: LotteryMiner-release-build
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Verify uploaded release artifact can be downloaded
        uses: actions/download-artifact@v7.0.0
        with:
          name: LotteryMiner-release-build
          path: release-artifact-check
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify downloaded release artifact
        run: |
          find release-artifact-check -type f -name '*.apk' -print -quit | grep -q .

      - name: Assemble installable debug test APK
        run: gradle assembleDebug --no-daemon

      - name: Verify debug APK signature and native ABI libraries
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libminercore.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libminercore.so'

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: LotteryMiner-debug-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: LotteryMiner-release-build
          path: release-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find release-artifact -type f -name '*.apk' -print -quit)
          test -n "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Lottery Miner $GITHUB_REF_NAME" \
            --notes "Signed APK built after native tests, JVM tests, lint, and Android native compilation. Source commit: $GITHUB_SHA"